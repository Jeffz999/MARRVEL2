<h4>{{ methodName() }}</h4>
<!--sup>
<mat-icon
  [matTooltip]="methodTooltip"
>help</mat-icon>
</sup-->
@if (score()) {
  <span
    class="text-underline-dashed pred-score"
    [ngClass]="getColorBin(minValue(), maxValue(), score())"
    [matTooltip]="scoreTooltip()"
    >
    {{ score() }}
  </span>
}
@if (prediction()) {
  <span
    class="text-underline-dashed pred-prediction"
    [ngClass]="predictionColorClass()[prediction()]"
    [matTooltip]="scoreTooltip()"
    >
    {{ prediction() }}
  </span>
}
<span class="label">Rank score:</span>
<app-rankscore-visual [rankscore]="rankscore()" />
